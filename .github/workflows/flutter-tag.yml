name: Flutter Tag Build

on:
  workflow_dispatch:
    inputs:
      macos-only:
        description: 'Retry macOS builds without rebuilding the other platforms'
        type: boolean
        default: false
      release-tag:
        description: 'Existing release tag to receive the repaired build assets'
        type: string
        required: false
      android-universal-from-run:
        description: 'Retry the universal APK using native libraries from an existing run ID'
        type: string
        required: false
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-[0-9]+'

jobs:
  run-flutter-tag-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ inputs.release-tag || github.ref_name }}
      macos-only: ${{ inputs.macos-only == true }}
      android-universal-from-run: ${{ inputs.android-universal-from-run || '' }}
